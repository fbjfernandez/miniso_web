# Configuración de análisis estático para MINISO Web POS (ISO/IEC 25010 - Mantenibilidad)
# Generada durante la auditoría QA. No modifica código fuente ni pruebas.

sonar.projectKey=miniso-web
sonar.projectName=MINISO Web POS
sonar.projectVersion=2.0.0
sonar.sourceEncoding=UTF-8

# Código de producción
sonar.sources=frontend,backend,api
# Pruebas (no cuentan para duplicación/deuda del producto)
sonar.tests=backend/test,tests

# Exclusiones de dependencias, entornos virtuales, artefactos y evidencias
sonar.exclusions=**/node_modules/**,venv/**,qa_evidencias/**,pruebas/**,tests/**,paginas/**,**/*.csv

sonar.test.exclusions=**/inspeccionar.py

# Lenguajes
sonar.javascript.file.suffixes=.js
sonar.python.file.suffixes=.py
sonar.python.version=3.13

# Métricas / cobertura (si se generan reportes, el scanner los recogerá)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml

# El SQL de Supabase se documenta, no se analiza como código fuente
sonar.sql.file.suffixes=.sql
